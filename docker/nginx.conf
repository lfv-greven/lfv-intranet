user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 35m;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Simple bot/probe blocklist for endpoints this app never serves.
        location ~* ^/(?:xmlrpc\.php|wp-login\.php|wp-config[^/]*|wp-(?:admin|content|includes)(?:/|$)|.*wp_filemanager\.php|.*\.(?:sql|bak|old|zip))(?:$|\?) {
            return 444;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Laravel best-practice: only execute the front controller.
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 32 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Drop direct access to any other script-like targets.
        location ~* ^/(?!index\.php$).*\.(?:php(?:[0-9]+)?|phtml|phar|cgi|pl|py|asp|aspx|jsp)(?:$|/) {
            return 444;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
