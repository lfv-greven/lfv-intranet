[program:queue]
directory=/var/www/html
command=/bin/sh -lc 'exec php artisan queue:work --sleep=3 --tries=3 --max-time=3600'
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
stopasgroup=true
killasgroup=true
